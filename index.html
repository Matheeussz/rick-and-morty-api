<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desenhos Anos 90/2000 - Rick and Morty Explorer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Mundo dos Desenhos: Rick and Morty</h1>
        <p>Explore os personagens em tempo real via API pública</p>
    </header>

    <main class="container">
        <section class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar personagem por nome...">
        </section>

        <!-- Container onde o JavaScript vai injetar os cards dinamicamente -->
        <section id="cardsContainer" class="cards-grid">
            <p class="loading">Carregando personagens...</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Projeto Front-End - Consumo de APIs</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
